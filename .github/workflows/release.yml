name: Release Windows build

# Builds and publishes the Windows installer on a *native* Windows runner.
#
# This exists because of a confirmed, documented electron-builder/NSIS
# failure class: cross-building a Windows NSIS installer from macOS can
# produce a corrupted uninstaller that fails Windows' own integrity check on
# uninstall (see electron-userland/electron-builder#4875 — the exact
# "Installer integrity check has failed" symptom, tied to a macOS host).
# Building on windows-latest removes that failure mode entirely.
#
# Trigger: push a tag matching v* (its suffix must match package.json's
# "version" field exactly, e.g. version "0.2.0-test.1" -> tag "v0.2.0-test.1")
# or run manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # jarvis-helper.exe — the native companion process (see
      # native/jarvis-helper and src/main/platform/helper.ts). Published
      # self-contained so the target PC never needs a .NET runtime
      # installed. electron-builder.yml's win.extraResources picks up the
      # exact output path below.
      #
      # `-o` sends the actual publish output somewhere electron-builder
      # never scans as app source; the `rm -rf` afterward is the real
      # fix, though — `dotnet publish --self-contained` also populates the
      # ordinary bin/obj build directories *inside* native/jarvis-helper
      # with the full self-contained runtime (confirmed by directly
      # inspecting a shipped release's app.asar: ~113MB of framework DLLs
      # under native/jarvis-helper/bin/... were ending up in the package
      # despite multiple attempts at excluding native/ via electron-builder
      # `files` patterns). Deleting bin/obj here means there is nothing
      # left under native/ for any packaging-glob subtlety to leak in the
      # first place, regardless of how electron-builder's matcher behaves.
      - name: Publish jarvis-helper.exe
        shell: bash
        run: |
          dotnet publish native/jarvis-helper/jarvis-helper.csproj -r win-x64 --self-contained true -c Release -o native/jarvis-helper/publish
          rm -rf native/jarvis-helper/bin native/jarvis-helper/obj

      # electron-builder's GitHub publisher has a real race condition: when
      # a release doesn't exist yet, its parallel per-file upload tasks each
      # try to create it at once, and only one file reliably lands on the
      # release that results (confirmed here — a v0.2.0-test.1 attempt
      # published with only the .blockmap attached, missing the installer
      # and the update-metadata yml entirely). Pre-creating the release
      # (idempotent — skipped if it already exists) means electron-builder
      # always hits the "already exists" path instead, which just uploads
      # assets to it with no race.
      - name: Ensure GitHub release exists
        shell: bash
        run: |
          set -e
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
          else
            gh release create "$TAG" --prerelease --title "$VERSION" --notes "Automated build for $VERSION."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: npm ci

      - run: npm run build

      # --publish always uploads the installer, the .blockmap, and the
      # channel metadata file (test.yml / latest.yml) that electron-updater
      # needs to find and verify updates — a manually-uploaded release asset
      # (the previous process) has no update metadata at all.
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
