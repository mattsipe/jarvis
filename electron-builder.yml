appId: com.weston.jarvis
productName: JARVIS
directories:
  buildResources: build
files:
  # A serious pre-existing packaging bug, found and confirmed by directly
  # inspecting a shipped release's actual app.asar (not assumed): every
  # release since jarvis-helper.exe was added has been shipping the FULL
  # .git history (CI's checkout includes .git/, and nothing excluded it —
  # a real concern beyond just size, since git history can carry things a
  # later commit removed) and a complete self-referential duplicate of
  # electron-builder's own output directory, including a second full copy
  # of electron.exe (~200MB) — dist/ isn't excluded, so electron-builder's
  # in-progress build output was getting swept into the very app.asar it
  # was building, in the same run. A shallow `dir/*` pattern (as this file
  # used for src/ and briefly for native/) does NOT recurse into
  # subdirectories in electron-builder's matcher — confirmed by testing —
  # so every directory exclusion below uses a leading `**/` and a
  # trailing `/**`, the pattern documented (and needed here, verified by
  # re-inspecting the actual packaged output) to reliably match regardless
  # of nesting depth.
  - '!**/.git/**'
  - '!**/dist/**'
  - '!**/.vscode/**'
  - '!**/src/**'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
  # native/jarvis-helper/bin's intermediate dotnet-publish output (dozens
  # of .NET framework DLLs) — only the final jarvis-helper.exe belongs,
  # placed separately below via extraResources (which reads straight from
  # that source path, independent of this `files` selection).
  - '!**/native/**'
  # Placed via extraResources below instead — a real file outside the asar
  # archive, like jarvis-helper.exe, rather than inside it (see that
  # extraResources entry's comment for why: the ONNX runtime's native
  # addon does its own file I/O on whatever path resourcePath() computes,
  # which fails if it's still an asar-virtual path — confirmed by an
  # actual packaged smoke test, not assumed).
  - '!**/resources/wakeword/**'
extraResources:
  # presence/wakeword.ts's local openWakeWord engine — see that file's
  # resourcePath(). Every platform needs these (mac for dev/testing too,
  # not just the Windows release), so this is a top-level entry rather
  # than scoped under `win:` the way jarvis-helper.exe is.
  - from: resources/wakeword
    to: wakeword
asarUnpack:
  - resources/**
  # onnxruntime-node (presence/wakeword.ts, the local openWakeWord engine)
  # ships a native .node addon that loads a sibling onnxruntime.dll via its
  # own internal (non-Node) library-loading code — that native loader has
  # no idea what an asar archive is, so it fails if the path it computes
  # still points inside the (virtual, compressed) archive. This is the
  # same class of bug hit and fixed for the previous Picovoice-based
  # engine; unpacking the whole package tree is the standard fix, since
  # Electron's asar-unpack redirect then makes every file in it resolve to
  # a real path on disk.
  - '**/node_modules/onnxruntime-node/**'
win:
  executableName: jarvis
  target:
    - target: nsis
      arch:
        - x64
  # jarvis-helper.exe (native/jarvis-helper) — built by the CI workflow
  # before this runs (see .github/workflows/release.yml). Windows-only:
  # darwin builds never carry it, and platform/helper.ts never spawns it
  # off win32 anyway.
  extraResources:
    - from: native/jarvis-helper/bin/Release/net8.0-windows/win-x64/publish/jarvis-helper.exe
      to: jarvis-helper.exe
  # onnxruntime-node ships every platform/arch's binaries in one tarball
  # (~280MB unpacked) plus DirectML's GPU-acceleration DLLs, neither of
  # which this Windows build needs: only win32/x64 is ever loaded here, and
  # the wake-word models are deliberately run on the 'cpu' execution
  # provider only (see wakeword.ts) — small enough that GPU acceleration
  # buys nothing but ~38MB of installer size for DLLs that are never
  # opened. Scoped to `win:` (rather than the root `files` list) so a local
  # macOS dev build still gets its own platform's binaries untouched.
  files:
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/DirectML.dll'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxcompiler.dll'
    - '!**/node_modules/onnxruntime-node/bin/napi-v6/win32/x64/dxil.dll'
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Explicit (matches electron-builder's own default) — user data in
  # %APPDATA%\jarvis (.env, ContextManager store, usage/telemetry) must
  # survive a normal uninstall unless the user chooses otherwise. Nothing
  # here deletes it; a full wipe is a manual, separate step by design.
  deleteAppDataOnUninstall: false
publish:
  - provider: github
    owner: mattsipe
    repo: jarvis
    # electron-builder's GitHub releaseType defaults to "draft" — without
    # this, --publish always silently creates a draft that nobody (not
    # even electron-updater) can see. "channel" fixes the update-metadata
    # filename (test.yml) so it's unambiguous and doesn't depend on
    # inferring anything from the version string. Both are deliberately
    # flipped by hand ("release" / omit channel, i.e. "latest") the day a
    # real stable channel starts — see src/main/update/updater.ts.
    releaseType: prerelease
    channel: test
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: JARVIS needs microphone access to hear you.
    - NSCameraUsageDescription: Not used.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: weston
npmRebuild: false
