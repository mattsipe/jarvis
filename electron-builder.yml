appId: com.weston.jarvis
productName: JARVIS
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintignore,.eslintrc.cjs,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
asarUnpack:
  - resources/**
win:
  executableName: jarvis
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  # Explicit (matches electron-builder's own default) — user data in
  # %APPDATA%\jarvis (.env, ContextManager store, usage/telemetry) must
  # survive a normal uninstall unless the user chooses otherwise. Nothing
  # here deletes it; a full wipe is a manual, separate step by design.
  deleteAppDataOnUninstall: false
publish:
  - provider: github
    owner: mattsipe
    repo: jarvis
    # electron-updater reads the update-channel file that matches the
    # running app's own version prerelease tag (e.g. "0.2.0-test.1" ->
    # "test.yml"). Publishing plain "1.0.0"-style versions later switches
    # the channel to "latest" automatically — see src/main/update/updater.ts.
mac:
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    - NSMicrophoneUsageDescription: JARVIS needs microphone access to hear you.
    - NSCameraUsageDescription: Not used.
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
  maintainer: weston
npmRebuild: false
